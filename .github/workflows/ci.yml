name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies (lockfile)
        run: uv sync --extra dev --frozen

      - name: Private knowledge focused tests
        run: uv run pytest tests/test_private_*.py tests/test_council.py -v --tb=short --no-cov

      - name: Private knowledge focused lint
        run: >-
          uv run ruff check
          src/knowledge/private_models.py
          src/knowledge/private_config.py
          src/knowledge/drive_source.py
          src/knowledge/private_ingest.py
          src/knowledge/private_sync.py
          src/knowledge/retriever.py
          src/council/orchestrator.py
          scripts/check_private_corpus.py
          scripts/sync_private_knowledge.py
          tests/test_private_*.py
          tests/test_council.py

      - name: Council OS focused lint
        run: >-
          uv run ruff check
          src/council/council_os_models.py
          src/council/expert_registry.py
          src/council/business_routing.py
          src/council/council_os.py

      - name: Public repository corpus guard
        run: uv run python scripts/check_private_corpus.py --tracked-only

      - name: Ruff (tests)
        run: uv run ruff check tests

      - name: Pytest
        run: uv run pytest tests/ -v --tb=short --no-cov

      - name: Quality soft gate (deterministic)
        run: uv run python tests/quality_gate.py
